# VM Configuration for power_mac_g4_tiger_3d (ppc)
# Tiger with an ATI Radeon 9700 PRO: OpenGL, Quartz Extreme and Core Image run
# on the host GPU. Needs the Radeon QEMU build (./install-deps.sh, macOS).
ARCH="ppc"
MACHINE_TYPE="mac99"
RAM_SIZE="2048M"
HD_SIZE="20G"
ROM_FILE=""
HD_IMAGE="vms/power_mac_g4_tiger_3d/hdd.qcow2"
DEFAULT_INSTALLER="macos_x_tiger"
DESCRIPTION="Mac OS X Tiger 10.4 - Radeon 9700 3D"

MAC_ADDRESS="08:00:07:10:04:03"

# Initial display mode - the guest can change it once booted.
DISPLAY_RES="1024x768x32"
# Resizable window that scales the guest display (macOS Cocoa only).
DISPLAY_ZOOM=true
# Display card: "std" (QEMU VGA) or "radeon9700" (ATI Radeon 9700 PRO).
DISPLAY_GPU="radeon9700"
# Host port forwarded to the guest sshd (Sharing > Remote Login), localhost only.
SSH_PORT="2222"
