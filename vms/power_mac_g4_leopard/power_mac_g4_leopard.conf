# VM Configuration for power_mac_g4_leopard (ppc)
ARCH="ppc"
MACHINE_TYPE="mac99"
RAM_SIZE="2048M"
HD_SIZE="10G"
ROM_FILE=""
HD_IMAGE="vms/power_mac_g4_leopard/hdd.qcow2"
DEFAULT_INSTALLER="macos_x_leopard"
DESCRIPTION="Mac OS X Leopard 10.5.6"
MAC_ADDRESS="08:00:07:10:05:03"

# Initial display mode - the guest can change it once booted.
DISPLAY_RES="1024x768x32"
# Resizable window that scales the guest display (macOS Cocoa only).
DISPLAY_ZOOM=true
# Display card: "std" (QEMU VGA) or "radeon9700" (ATI Radeon 9700 PRO: OpenGL,
# Quartz Extreme and Core Image; needs the Radeon QEMU build, see README).
DISPLAY_GPU="std"
