name: Test Scripts

# Every job here is orchestration only: install OS packages, then call one
# script in tests/ci/. Logic embedded in `run:` blocks is invisible to
# shellcheck, reads badly in a diff, and can only be run inside Actions -
# these can all be run by hand on a matching host.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'   # Mondays 04:00 UTC - catches upstream QEMU breakage

jobs:
  # Ubuntu is pinned rather than 'latest' so the QEMU version under test is a
  # known quantity: 24.04 ships QEMU 8.2 (the floor QemuMac supports) and
  # 26.04 ships a much newer one. Testing both ends is the point - 'latest'
  # would silently drop the older end the day the alias moves.
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/ci/install-test-deps.sh
      - run: ./tests/run-tests.sh

  bash32:
    name: bash 3.2 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/ci/check-bash32.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: ./tests/ci/check-shellcheck.sh

  # Runs on both Ubuntu releases, so a real 68k and PPC guest is booted under
  # the oldest QEMU the project claims to support and under a current one.
  install-linux:
    name: Linux integration (${{ matrix.os }}, apt install + real boot)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install xvfb (SDL needs a display)
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: ./tests/ci/linux-integration.sh

  linux-shared-disk:
    name: Shared disk (real HFS+ loop mount)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install hfsprogs and kernel modules
        run: |
          sudo apt-get update
          sudo apt-get install -y hfsprogs jq lsof qemu-utils
          # The stock Azure runner kernel ships no hfsplus module, so without
          # this the test can only skip. The package name is kernel-version
          # specific and is not always published, hence best effort.
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" \
            || echo "no linux-modules-extra for $(uname -r) - hfsplus may be unavailable"
      - run: ./tests/ci/linux-shared-disk.sh

  install-macos:
    name: macOS integration (brew install + real QEMU)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/ci/macos-integration.sh

  # A source build takes tens of minutes, so it does not run on every push.
  # Trigger it by hand before a release; weekly means upstream QEMU breaking
  # ./configure is noticed without anyone remembering to look.
  source-build:
    name: Build QEMU from source (manual / weekly)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install xvfb (SDL needs a display)
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: ./tests/ci/linux-source-build.sh

  database:
    name: Software database URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: ./tests/ci/check-database-urls.sh
