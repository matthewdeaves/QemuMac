name: Test Scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y jq lsof
          else
            jq --version   # jq and lsof ship with the macOS runner image
            # hfsutils is what mount-shared.sh uses on macOS (there is no
            # kernel HFS write support), so without it the macOS shared-disk
            # path dies on a missing command before its own checks run.
            brew install hfsutils
          fi

      - name: Run test suite
        run: ./tests/run-tests.sh

  bash32:
    name: bash 3.2 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # macOS ships bash 3.2. The macOS job above exercises it implicitly;
      # this pins the exact version so a bash 4+ construct fails loudly.
      - name: Parse all scripts under bash 3.2
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo bash:3.2 \
            sh -c 'for f in run-mac.sh iso-downloader.sh install-deps.sh \
                            mount-shared.sh lib/common.sh tests/run-tests.sh; do
                     bash -n "$f" || exit 1
                   done'

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # No blanket excludes. The few intentional patterns (dynamic
          # `source` of VM configs, deliberate word splitting, globals read by
          # sourcing scripts) carry inline `# shellcheck disable=` directives
          # at the exact line, so a real problem elsewhere still fails.
          shellcheck -S warning \
            run-mac.sh iso-downloader.sh install-deps.sh mount-shared.sh \
            lib/common.sh tests/run-tests.sh

  install-linux:
    name: Linux integration (apt install + real boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The unit suite never executes the package-manager path, so a wrong
      # package name (there is no 'qemu-img' package - qemu-utils provides it)
      # would only surface on a user's machine. This runs the real script.
      - name: Install QEMU through install-deps.sh
        run: printf '1\n' | ./install-deps.sh

      - name: Both QEMU targets and qemu-img are actually present
        run: |
          qemu-system-m68k --version
          qemu-system-ppc --version
          qemu-img --version
          command -v jq curl unzip

      - name: Install xvfb
        run: sudo apt-get install -y xvfb

      # Boot a real VM through run-mac.sh itself. This is the only place the
      # Linux path runs end to end: the SDL display branch (hence xvfb - SDL
      # needs a display), the automatic ROM download, qemu-img disk creation,
      # PRAM creation and boot patching, shared-disk setup, and the exec into
      # QEMU. Success is QEMU still running after the sleep; it boots to a
      # "no bootable disk" screen, which is expected with a blank drive.
      - name: Boot a VM end to end through run-mac.sh
        run: |
          mkdir -p vms/ci_m68k
          cat > vms/ci_m68k/ci_m68k.conf <<'CONF'
          ARCH="m68k"
          MACHINE_TYPE="q800"
          RAM_SIZE="128M"
          HD_SIZE="512M"
          PRAM_FILE="vms/ci_m68k/pram.img"
          HD_IMAGE="vms/ci_m68k/hdd.qcow2"
          MAC_ADDRESS="08:00:07:c1:c1:01"
          HD_SCSI_ID=6
          CD_SCSI_ID=3
          SHARED_SCSI_ID=4
          DISPLAY_RES="800x600x8"
          CONF

          xvfb-run -a ./run-mac.sh --config vms/ci_m68k/ci_m68k.conf > /tmp/run.log 2>&1 &
          sleep 30

          if ! pgrep -f qemu-system-m68k >/dev/null; then
            echo "::error::run-mac.sh did not leave QEMU running"
            cat /tmp/run.log
            exit 1
          fi
          echo "QEMU is running. Command line:"
          pgrep -af qemu-system-m68k | head -1
          pkill -f qemu-system-m68k || true

          # The ROM must have been fetched and verified against its md5, and
          # the disk, PRAM and shared disk created.
          test -f roms/800.ROM          || { echo "::error::ROM not downloaded"; exit 1; }
          test -f vms/ci_m68k/hdd.qcow2 || { echo "::error::disk not created"; exit 1; }
          test -f vms/ci_m68k/pram.img  || { echo "::error::PRAM not created"; exit 1; }
          test -f shared/shared-disk.img || { echo "::error::shared disk not created"; exit 1; }
          grep -q "sdl" /tmp/run.log     || { echo "::error::did not take the SDL branch"; exit 1; }
          echo "end-to-end Linux boot OK"

      # The PRAM boot patch is what selects the boot device on 68k, so assert
      # the real bytes rather than trusting the earlier unit test alone.
      - name: PRAM boot patch is byte-correct after a real run
        run: |
          got=$(od -An -tx1 -j120 -N4 vms/ci_m68k/pram.img | tr -d ' \n')
          echo "PRAM bytes at offset 120: $got"
          [ "$got" = "ffffffd9" ] \
            || { echo "::error::expected ffffffd9 for SCSI ID 6, got $got"; exit 1; }

      # Prove the checks above can fail, so a broken assertion cannot pass
      # silently. With a valid ROM loaded, QEMU rejects an unknown device.
      - name: Negative control - QEMU rejects a bad device
        run: |
          out=$(qemu-system-m68k -M q800 -m 128M -display none \
                  -bios roms/800.ROM -device definitely-not-a-real-device 2>&1 || true)
          echo "$out" | tail -1
          echo "$out" | grep -q "is not a valid device model name" \
            || { echo "::error::negative control did not trip - checks may be vacuous"; exit 1; }
          echo "negative control tripped as expected"

  linux-shared-disk:
    name: Shared disk (real HFS+ loop mount)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install hfsprogs and helpers
        run: sudo apt-get update && sudo apt-get install -y hfsprogs jq lsof qemu-utils

      - name: Does this kernel support hfsplus?
        id: probe
        run: |
          sudo modprobe hfsplus 2>/dev/null || true
          if grep -qw hfsplus /proc/filesystems; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::warning::kernel has no hfsplus support - real mount not exercised"
          fi

      # The genuine article: format a real HFS+ volume, mount it through
      # mount-shared.sh, deliver a file, and release it.
      - name: Real mount, deliver, unmount
        if: steps.probe.outputs.supported == 'true'
        run: |
          set -e
          mkdir -p shared
          qemu-img create -f raw shared/shared-disk.img 64M
          mkfs.hfsplus -v QemuMacTest shared/shared-disk.img

          ./mount-shared.sh
          mountpoint -q /tmp/qemu-shared || { echo "::error::not mounted"; exit 1; }

          echo "built-on-the-host" > /tmp/qemu-shared/MyApp
          test -f /tmp/qemu-shared/MyApp

          ./mount-shared.sh -u
          mountpoint -q /tmp/qemu-shared && { echo "::error::still mounted"; exit 1; }

          # The file must survive the round trip through the HFS+ volume.
          ./mount-shared.sh
          grep -q built-on-the-host /tmp/qemu-shared/MyApp \
            || { echo "::error::file did not persist"; exit 1; }
          ./mount-shared.sh -u
          echo "real HFS+ round trip OK"

      - name: The in-use guard refuses a real mount
        if: steps.probe.outputs.supported == 'true'
        run: |
          exec 9<>shared/shared-disk.img
          out=$(./mount-shared.sh 2>&1 || true)
          exec 9>&-
          echo "$out"
          echo "$out" | grep -q "in use" \
            || { echo "::error::mount-shared.sh did not refuse a disk held open"; exit 1; }
          mountpoint -q /tmp/qemu-shared && { echo "::error::mounted anyway"; exit 1; }
          echo "in-use guard OK against a real mount"

  database:
    name: Software database URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check database URLs are reachable
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          # Reachability is informational: these are third-party archives, so
          # a transient outage should not fail the build. Structural validity
          # of the database is asserted by the test suite.
          fails=0
          while read -r url; do
            [ -z "$url" ] && continue
            if curl --head --fail --silent --location --max-time 20 "$url" >/dev/null; then
              echo "ok    $url"
            else
              echo "FAIL  $url"
              fails=$((fails + 1))
            fi
          done < <(jq -r '(.cds, .roms) | .[] | .url // empty' iso/software-database.json)
          echo "::notice::${fails} database URL(s) unreachable"
